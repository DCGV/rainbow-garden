<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sophia &amp; David and the Rainbow Garden</title>
<style>
:root{--btn:72px;--gap:12px;--fs:24px;--ink:#2b2350;--paper:#fffdf6;--pri:#ffd92e;--on:#b9f2c6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7fd0ff;color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  font-size:var(--fs);font-weight:700;line-height:1.3;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;background:#9fd8ff;
  image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated}
#fxl{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
#fxl>div{position:absolute;left:0;top:0;will-change:transform}
.bub{background:#fff;border:4px solid var(--ink);border-radius:22px;padding:4px;box-shadow:0 4px 0 rgba(43,35,80,.3);line-height:0}
.bub.pop{border-radius:50%;padding:8px;background:#fff8d8}
.zz{font-size:1.1em;color:#fff;letter-spacing:3px;text-shadow:0 3px 0 #2b2350,3px 0 0 #2b2350,-3px 0 0 #2b2350,0 -3px 0 #2b2350}
body.ovopen #fxl{visibility:hidden}
#nogl{background:#7fd0ff}
#nogl hr{border:0;border-top:4px dashed #b9b2d8;margin:14px 0}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
.b{min-width:var(--btn);min-height:var(--btn);padding:6px 22px;border:4px solid var(--ink);
  border-radius:calc(var(--btn)*.32);background:var(--paper);box-shadow:0 6px 0 rgba(43,35,80,.45);
  display:inline-flex;align-items:center;justify-content:center;text-align:center;position:relative;touch-action:manipulation}
.b:active,.b.down{transform:translateY(4px);box-shadow:0 2px 0 rgba(43,35,80,.45)}
.b:focus{outline:5px solid #ff7a00;outline-offset:3px}
.b:focus:not(:focus-visible){outline:none}
.b.pri{background:var(--pri)}
.b.on{background:var(--on)}
.b[disabled]{opacity:.55;cursor:default;box-shadow:0 3px 0 rgba(43,35,80,.3)}
.ib{padding:0;width:var(--btn);height:var(--btn)}
canvas.ic{display:block;pointer-events:none;flex:none}

/* ---------- in-game HUD ---------- */
#top{position:fixed;left:0;top:0;right:0;height:calc(var(--btn) + 16px + env(safe-area-inset-top,0px));padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 8px calc(12px + env(safe-area-inset-left,0px));display:grid;
  grid-template-columns:auto 1fr auto;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.grp{display:grid;grid-auto-flow:column;grid-gap:var(--gap)}
#mid{display:grid;grid-auto-flow:column;justify-content:center;align-items:center;grid-gap:6px;pointer-events:none!important}
#lvlName{background:rgba(255,253,246,.85);border-radius:999px;padding:2px 16px;margin-right:8px;font-size:.8em;white-space:nowrap}
.off{filter:grayscale(1);opacity:.35}
.hero.active{background:var(--pri);box-shadow:0 0 0 4px #ff7a00,0 6px 0 rgba(43,35,80,.45)}
.hero .k{position:absolute;right:5px;bottom:-1px;font-size:.75em;opacity:.75}
#dpad{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,var(--btn));
  grid-template-rows:repeat(3,var(--btn));grid-gap:var(--gap)}
#dU{grid-column:2;grid-row:1}#dL{grid-column:1;grid-row:2}#dR{grid-column:3;grid-row:2}#dD{grid-column:2;grid-row:3}
#act{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px) + var(--btn)*.75 + var(--gap));width:calc(var(--btn)*1.5);
  height:calc(var(--btn)*1.5);border-radius:50%;background:#7df0a0;padding:0}
body.who-D #act{background:#8fd0ff}
body.lay-over #dpad,body.lay-over #act{opacity:.74}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--btn) + 22px);max-width:86vw;
  background:var(--paper);border:4px solid var(--ink);border-radius:26px;padding:8px 22px 8px 10px;
  display:flex;align-items:center;box-shadow:0 6px 0 rgba(43,35,80,.3);pointer-events:none}
#toast span{margin-left:10px}

/* ---------- screens, overlays, cards ---------- */
.screen,.ov{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:14px;overflow:auto;touch-action:pan-y}
.ov{background:rgba(30,22,70,.5)}
#dlg{background:rgba(30,22,70,.22);justify-content:flex-end;padding-bottom:22px}
.card{background:var(--paper);border:5px solid var(--ink);border-radius:34px;padding:18px 24px 22px;
  box-shadow:0 10px 0 rgba(43,35,80,.35);max-width:94vw;width:860px;max-height:96vh;overflow:auto;text-align:center}
.card.narrow{width:620px}
.menu{display:grid;grid-gap:var(--gap);margin-top:14px}
.menu.two{grid-template-columns:1fr 1fr}
.menu.three{grid-template-columns:1fr 1fr 1fr}
h1,h2{margin:0 0 .25em}
h1{font-size:1.9em;line-height:1.05}
h1 small{display:block;font-size:.6em;margin-top:.15em}
h2{font-size:1.35em}
.rb{background:linear-gradient(90deg,#ff3d55,#ff8a1e,#e0a800,#22b455,#2f7dff,#9a4dff);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#ff3d55}
#lvlGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--btn)*3.1),1fr));grid-gap:var(--gap);margin:10px 0 4px}
.lvl{padding:8px 14px;justify-content:flex-start;text-align:left}
.lvl span{margin-left:10px}
#bookGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--btn)*1.9),1fr));grid-gap:10px;margin:10px 0 4px}
.stk{background:#fff;border:3px dashed #b9b2d8;border-radius:22px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;font-size:.75em;line-height:1.15}
.stk.got{border:3px solid var(--ink);background:#fff8d8}
.stk:not(.got) canvas{filter:grayscale(1);opacity:.3}
.stk:not(.got) span{opacity:.6}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;grid-gap:var(--gap);width:100%}
.tg{justify-content:space-between;width:100%}
.tg .st{margin-left:16px;border:3px solid var(--ink);border-radius:999px;padding:0 14px;background:#fff;min-width:3.2em}
.tg.on .st{background:#2fb85a;color:#fff}
#setList{display:grid;grid-template-columns:1fr 1fr;grid-gap:var(--gap);margin-top:12px;text-align:left}
#volRow{grid-column:1/3;display:grid;grid-template-columns:auto 1fr;align-items:center;grid-gap:18px;
  border:4px solid var(--ink);border-radius:calc(var(--btn)*.32);padding:0 22px;min-height:var(--btn);background:var(--paper)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:var(--btn);background:transparent;margin:0;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:16px;border-radius:8px;background:#cfc8ee;border:3px solid var(--ink)}
input[type=range]::-moz-range-track{height:12px;border-radius:8px;background:#cfc8ee;border:3px solid var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;background:var(--pri);border:4px solid var(--ink);margin-top:-17px}
input[type=range]::-moz-range-thumb{width:38px;height:38px;border-radius:50%;background:var(--pri);border:4px solid var(--ink)}
input[type=range]:focus{outline:5px solid #ff7a00;outline-offset:2px;border-radius:12px}
#dlgCard{display:grid;grid-template-columns:auto 1fr;grid-gap:6px 18px;align-items:center;text-align:left;width:900px}
#dlgText{font-size:1.12em}
#dlgPic{display:flex;flex-wrap:wrap;align-items:center;margin-top:6px}
#dlgPic canvas{margin:2px 3px}
#dlgBtn{grid-column:1/3;justify-self:end}
#sEnd{justify-content:flex-start;padding-top:3vh}
body.ovopen .screen{visibility:hidden}
#sTitle .card{width:640px}
@media (max-width:640px){#setList{grid-template-columns:1fr}#volRow{grid-column:1}.menu.three{grid-template-columns:1fr}}

/* ---------- comfort options ---------- */
body.calm{--paper:#f6f2e6;--pri:#ecd98a;--on:#cfe6d2}
body.calm #game{filter:saturate(.55) brightness(1.03)}
body.calm .rb{background:none;-webkit-text-fill-color:currentColor;color:var(--ink)}
body.hc{--paper:#ffffff;--ink:#000000;--pri:#ffe600;--on:#7dffa0}
body.hc #game{filter:contrast(1.22) saturate(1.2)}
body.hc.calm #game{filter:contrast(1.22) saturate(.6)}
body.hc .b{border-width:6px}
body.hc .ov{background:rgba(0,0,0,.72)}
body.hc #dlg{background:rgba(0,0,0,.5)}
body.hc .rb{background:none;-webkit-text-fill-color:currentColor;color:#000}
body.hc #lvlName{background:#fff}
</style>
</head>
<body>
<canvas id="game" aria-label="Rainbow Garden"></canvas>
<div id="fxl" aria-hidden="true"></div>
<div id="nogl" class="screen hidden" role="alert"><div class="card narrow">
  <h2 id="noglEn1" lang="en">Oh no! This browser cannot show the 3D garden.</h2><div id="noglEn2" lang="en"></div><hr>
  <h2 id="noglFr1" lang="fr">Oh non! Ce navigateur ne peut pas montrer le jardin en 3D.</h2><div id="noglFr2" lang="fr"></div>
</div></div>

<!-- ===== in-game controls (always visible while playing) ===== -->
<div id="hud" class="hidden">
  <div id="top">
    <div class="grp">
      <button id="bPause" class="b ib" tabindex="-1" data-i18n-aria="a_pause"><canvas class="ic" data-icon="pause" data-s="0.62"></canvas></button>
      <button id="bHint" class="b ib" tabindex="-1" data-i18n-aria="a_hint"><canvas class="ic" data-icon="sunnyq" data-s="0.86"></canvas></button>
      <button id="bCam" class="b ib" tabindex="-1" data-i18n-aria="a_cam"><canvas class="ic" data-icon="camera" data-s="0.72"></canvas></button>
    </div>
    <div id="mid"><span id="lvlName"></span><span id="gems" style="display:grid;grid-auto-flow:column;grid-gap:4px"></span></div>
    <div class="grp">
      <button id="bS" class="b ib hero" tabindex="-1" data-i18n-aria="a_s"><canvas class="ic" data-icon="sophia" data-s="0.9"></canvas><span class="k">1</span></button>
      <button id="bD" class="b ib hero" tabindex="-1" data-i18n-aria="a_d"><canvas class="ic" data-icon="david" data-s="0.9"></canvas><span class="k">2</span></button>
    </div>
  </div>
  <div id="dpad">
    <button id="dU" class="b ib" tabindex="-1" data-i18n-aria="a_up"><canvas class="ic" data-icon="up" data-s="0.6"></canvas></button>
    <button id="dL" class="b ib" tabindex="-1" data-i18n-aria="a_left"><canvas class="ic" data-icon="left" data-s="0.6"></canvas></button>
    <button id="dR" class="b ib" tabindex="-1" data-i18n-aria="a_right"><canvas class="ic" data-icon="right" data-s="0.6"></canvas></button>
    <button id="dD" class="b ib" tabindex="-1" data-i18n-aria="a_down"><canvas class="ic" data-icon="down" data-s="0.6"></canvas></button>
  </div>
  <button id="act" class="b" tabindex="-1" data-i18n-aria="a_act"><canvas id="actIc" class="ic" data-icon="walker" data-s="1.15"></canvas></button>
  <div id="toast" class="hidden" role="status" aria-live="polite"><canvas id="toastIc" class="ic" data-icon="sunny" data-s="0.8"></canvas><span id="toastTx"></span></div>
</div>

<!-- ===== title screen ===== -->
<div id="sTitle" class="screen">
  <div class="card">
    <h1><span class="rb" data-i18n="title1"></span><small data-i18n="title2"></small></h1>
    <div class="menu two">
      <button id="lEn" class="b" lang="en">English</button>
      <button id="lFr" class="b" lang="fr">Fran&ccedil;ais</button>
    </div>
    <div class="menu">
      <button id="mPlay" class="b pri" data-i18n="play"></button>
    </div>
    <div class="menu three">
      <button id="mLevels" class="b" data-i18n="levels"></button>
      <button id="mBook" class="b" data-i18n="stickers"></button>
      <button id="mSet" class="b" data-i18n="settings"></button>
    </div>
  </div>
</div>

<!-- ===== ending screen ===== -->
<div id="sEnd" class="screen hidden">
  <div class="card narrow">
    <h1 class="rb" data-i18n="thanks"></h1>
    <div data-i18n="end1"></div>
    <div class="menu three">
      <button id="eAgain" class="b pri" data-i18n="playAgain"></button>
      <button id="eBook" class="b" data-i18n="stickers"></button>
      <button id="eHome" class="b" data-i18n="home"></button>
    </div>
  </div>
</div>

<!-- ===== overlays ===== -->
<div id="pause" class="ov hidden">
  <div class="card narrow">
    <h2 data-i18n="paused"></h2>
    <div class="menu">
      <button id="pResume" class="b pri" data-i18n="resume"></button>
      <button id="pRestart" class="b" data-i18n="restart"></button>
    </div>
    <div class="menu two">
      <button id="pLevels" class="b" data-i18n="levels"></button>
      <button id="pBook" class="b" data-i18n="stickers"></button>
      <button id="pSet" class="b" data-i18n="settings"></button>
      <button id="pHome" class="b" data-i18n="home"></button>
    </div>
  </div>
</div>

<div id="levels" class="ov hidden">
  <div class="card">
    <h2 data-i18n="levels"></h2>
    <div id="lvlGrid"></div>
    <div class="menu"><button class="b pri backBtn" data-i18n="back"></button></div>
  </div>
</div>

<div id="book" class="ov hidden">
  <div class="card">
    <h2 data-i18n="stickers"></h2>
    <div id="bookGrid"></div>
    <div class="menu"><button class="b pri backBtn" data-i18n="back"></button></div>
  </div>
</div>

<div id="settings" class="ov hidden">
  <div class="card">
    <h2 data-i18n="settings"></h2>
    <div id="setList">
      <button id="tMusic" class="b tg" data-set="music"><span data-i18n="music"></span><span class="st"></span></button>
      <button id="tMute" class="b tg" data-set="mute"><span data-i18n="mute"></span><span class="st"></span></button>
      <label id="volRow"><span data-i18n="volume"></span><input id="vol" type="range" min="0" max="100" step="5"></label>
      <button id="tRead" class="b tg" data-set="read"><span data-i18n="read"></span><span class="st"></span></button>
      <button id="tTap" class="b tg" data-set="tap"><span data-i18n="tap"></span><span class="st"></span></button>
      <button id="tHc" class="b tg" data-set="hc"><span data-i18n="hc"></span><span class="st"></span></button>
      <button id="tCalm" class="b tg" data-set="calm"><span data-i18n="calm"></span><span class="st"></span></button>
    </div>
    <div class="menu"><button class="b pri backBtn" data-i18n="back"></button></div>
  </div>
</div>

<div id="dlg" class="ov hidden">
  <div id="dlgCard" class="card" role="dialog" aria-live="polite">
    <canvas id="dlgWho" class="ic" data-icon="sunny" data-s="1.7"></canvas>
    <div><div id="dlgText"></div><div id="dlgPic"></div></div>
    <button id="dlgBtn" class="b pri"></button>
  </div>
</div>

<script>
(function () {
'use strict';

/* =========================================================================
   1. CONFIG  -  the settings a grown-up is most likely to want to change
   ========================================================================= */
const CONFIG = {
  sophiaSpeed: 3.0,     // Sophia's speed in tiles per second (steady and comfortable)

      music: 'Music', volume: 'Volume', mute: 'Mute', read: 'Read to me', hc: 'High contrast',
      calm: 'Calm colors', tap: 'Tap to move', on: 'On', off: 'Off', locked: 'Locked',

      tr6: 'Sugar Heart', tr7: 'Cloud Bell', tr8: 'Tiny Birdhouse', tr9: 'Snowflake Gem', tr10: 'Rainbow Ribbon',
      stSunny: "Sunny's Thank-You", stMaster: 'Rainbow Heroes',

/* ---------- small helpers ---------- */
const $ = function (id) { return document.getElementById(id); };
const qsa = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
const clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
const lerp = function (a, b, u) { return a + (b - a) * u; };
const TAU = Math.PI * 2;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];          // 0 up (north), 1 right (east), 2 down (south), 3 left (west)
function rng(seed) {                                    // tiny repeatable random numbers (for scenery)
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let v = s; v = Math.imul(v ^ (v >>> 15), v | 1); v ^= v + Math.imul(v ^ (v >>> 7), v | 61);
    return ((v ^ (v >>> 14)) >>> 0) / 4294967296;
  };
}


const NLEVELS = 10;     // how many levels (and Rainbow Stones) the game has

/* =========================================================================
   2. SAVE  -  progress lives only in this browser (localStorage). Nothing is sent anywhere.
   -------------------------------------------------------------------------
   Version 2 uses a NEW key, so the old 5-level save is never overwritten.
   The first time this version runs, it reads the old save (if there is one)
   and copies its stones, treasures, stickers and settings across.
   ========================================================================= */
function zeros(n) { const a = []; for (let i = 0; i < n; i++) a.push(0); return a; }
const Save = {
  d: null,
  migrated: false,
  fresh: function () {
    const df = CONFIG.defaults;
    let lang = df.language;
    if (lang !== 'en' && lang !== 'fr') {
      let nl = '';
      try { nl = String(navigator.language || ''); } catch (e) { nl = ''; }
      lang = nl.toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
    }
    return {
      v: 2, lang: lang, level: 0, unlocked: 0, intro: 0, won: 0, won5: 0,
      stones: zeros(NLEVELS), treasures: zeros(NLEVELS),
      set: { music: !!df.music, volume: clamp(Number(df.volume) || 0, 0, 100), mute: !!df.mute, read: !!df.readAloud,
             calm: !!df.calmColors, hc: !!df.highContrast, tap: !!df.tapToMove }
    };
  },
  read: function (key) {                                   // returns a parsed object, or null if missing or broken
    try {
      const raw = window.localStorage.getItem(key);
      if (!raw) return null;
      const o = JSON.parse(raw);
      return (o && typeof o === 'object') ? o : null;
    } catch (e) { return null; }
  },
  copySettings: function (d, s) {
    if (!s || typeof s !== 'object') return;
    const keys = ['music', 'mute', 'read', 'calm', 'hc', 'tap'];
    for (let k = 0; k < keys.length; k++) { if (typeof s[keys[k]] === 'boolean') d.set[keys[k]] = s[keys[k]]; }
    if (typeof s.volume === 'number' && isFinite(s.volume)) d.set.volume = clamp(s.volume, 0, 100);
  },
  load: function () {
    const d = this.fresh();
    const o = this.read(CONFIG.saveKey);
    if (o && o.v === 2) {
      if (o.lang === 'en' || o.lang === 'fr') d.lang = o.lang;
      d.level = clamp(o.level | 0, 0, NLEVELS - 1); d.unlocked = clamp(o.unlocked | 0, 0, NLEVELS - 1);
      d.intro = o.intro ? 1 : 0; d.won = o.won ? 1 : 0; d.won5 = o.won5 ? 1 : 0;
      for (let i = 0; i < NLEVELS; i++) {
        d.stones[i] = (Array.isArray(o.stones) && o.stones[i]) ? 1 : 0;
        d.treasures[i] = (Array.isArray(o.treasures) && o.treasures[i]) ? 1 : 0;
      }
      this.copySettings(d, o.set);
      if (d.level > d.unlocked) d.level = d.unlocked;
      this.d = d;
      return;
    }
    // No version-2 save yet (or it was broken): look for the 5-level game's save and bring it across.
    const old = this.read(CONFIG.oldSaveKey);
    if (old && old.v === 1) {
      if (old.lang === 'en' || old.lang === 'fr') d.lang = old.lang;
      d.intro = old.intro ? 1 : 0;
      let all = true;
      for (let i = 0; i < 5; i++) {
        d.stones[i] = (Array.isArray(old.stones) && old.stones[i]) ? 1 : 0;
        d.treasures[i] = (Array.isArray(old.treasures) && old.treasures[i]) ? 1 : 0;
        if (!d.stones[i]) all = false;
      }
      d.won5 = (old.won || all) ? 1 : 0;                   // "Sunny's Thank-You" sticker is kept
      if (d.won5) { d.unlocked = 5; d.level = 5; }         // finished all five: Level 6 is waiting
      else { d.unlocked = clamp(old.unlocked | 0, 0, 4); d.level = clamp(old.level | 0, 0, d.unlocked); }
      this.copySettings(d, old.set);
      this.migrated = true;
    }
    this.d = d;
    if (this.migrated) this.store();                       // writes the NEW key only; the old one is left as it was
  },
  store: function () {
    try { window.localStorage.setItem(CONFIG.saveKey, JSON.stringify(this.d)); } catch (e) { /* no storage: the game still runs */ }
  }
};

/* =========================================================================
   3. I18N  -  language switching
   ========================================================================= */
function t(key) {
  const tab = CONFIG.strings[Save.d.lang] || CONFIG.strings.en;
  if (Object.prototype.hasOwnProperty.call(tab, key)) return tab[key];
  if (Object.prototype.hasOwnProperty.call(CONFIG.strings.en, key)) return CONFIG.strings.en[key];
  return key;
}

const MEL = [5, -1, 4, 5, 7, -1, 5, -1, 4, 3, 2, -1, 3, -1, -1, -1, 2, -1, 3, 4, 5, -1, 7, -1, 6, 5, 4, -1, 5, -1, -1, -1];
const BASS = [0, 3, 2, 0, 0, 3, 2, 3];
const PENTA = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25, 783.99, 880.0];
const Snd = {
  ctx: null, master: null, mus: null, fx: null, nbuf: null, failed: false, nextT: 0, pos: 0, key: 1,
  init: function () {
    if (this.ctx || this.failed) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.failed = true; return; }
      const c = new AC();
      this.master = c.createGain(); this.master.connect(c.destination);
      this.mus = c.createGain(); this.mus.connect(this.master);
      this.fx = c.createGain(); this.fx.connect(this.master);
      const len = Math.floor(c.sampleRate * 0.5);
      this.nbuf = c.createBuffer(1, len, c.sampleRate);
      const ch = this.nbuf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      this.ctx = c;
      this.apply();
    } catch (e) { this.ctx = null; this.failed = true; }
  },
  // Browsers only allow sound after a click, tap or key press, so this is called from those.
  unlock: function () {
    this.init();
    const c = this.ctx;
    if (c && c.state === 'suspended' && !document.hidden) {
      try { const p = c.resume(); if (p && p.catch) p.catch(function () {}); } catch (e) { /* ignore */ }
    }
  },
  suspend: function () {
    const c = this.ctx;
    if (c && c.state === 'running') {
      try { const p = c.suspend(); if (p && p.catch) p.catch(function () {}); } catch (e) { /* ignore */ }
    }
  },
  apply: function () {
    if (!this.ctx) return;
    const s = Save.d.set;
    try {
      this.master.gain.value = s.mute ? 0 : clamp(s.volume / 100, 0, 1);
      this.mus.gain.value = s.music ? 0.6 : 0;
    } catch (e) { /* ignore */ }
  },
  ready: function () { return !!(this.ctx && this.ctx.state === 'running'); },
  tone: function (f, at, dur, vol, type, f2, dest) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, at);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, at + dur);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(vol, at + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(dest || this.fx);
    o.start(at); o.stop(at + dur + 0.05);
  },
  noise: function (at, dur, vol, freq, q) {
    const c = this.ctx, s = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.nbuf; bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q || 1;
    g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    s.connect(bp); bp.connect(g); g.connect(this.fx);
    s.start(at); s.stop(at + dur + 0.02);
  },
  sfx: function (name) {
    if (!this.ready()) return;
    try { this.play(name); } catch (e) { /* a missing sound must never break the game */ }
  },
  play: function (n) {
    const a = this.ctx.currentTime + 0.005, me = this;
    const chime = function (at, fs, v) { for (let i = 0; i < fs.length; i++) me.tone(fs[i], at + i * 0.07, 0.42, v, 'sine'); };
    switch (n) {
      case 'step': this.tone(520, a, 0.07, 0.07, 'triangle', 380); break;
      case 'roll': this.noise(a, 0.06, 0.05, 900, 2); this.tone(190, a, 0.06, 0.05, 'sine', 160); break;
      case 'push': this.noise(a, 0.26, 0.16, 220, 1.2); this.tone(120, a, 0.24, 0.12, 'sine', 90); break;
      case 'boing': this.tone(230, a, 0.13, 0.2, 'sine', 700); this.tone(700, a + 0.12, 0.24, 0.18, 'sine', 330); break;
      case 'hop': this.tone(420, a, 0.1, 0.12, 'sine', 640); break;
      case 'chime': chime(a, [880, 1108.7, 1318.5, 1760], 0.11); break;
      case 'small': chime(a, [1318.5, 1760], 0.08); break;
      case 'splash': this.noise(a, 0.32, 0.2, 1300, 0.8); this.tone(320, a, 0.25, 0.1, 'sine', 110); break;
      case 'bump': this.tone(160, a, 0.09, 0.1, 'sine', 115); break;
      case 'click': this.tone(320, a, 0.09, 0.1, 'square', 210); this.tone(990, a + 0.06, 0.2, 0.07, 'sine'); break;
      case 'gate': this.tone(196, a, 0.3, 0.07, 'sawtooth', 392); chime(a + 0.25, [784, 987.8, 1174.7], 0.1); break;
      case 'whistle': this.tone(900, a, 0.16, 0.13, 'sine', 1450); this.tone(1450, a + 0.17, 0.22, 0.13, 'sine', 1000); break;
      case 'rabbit': this.tone(1200, a, 0.07, 0.1, 'sine', 1650); this.tone(1300, a + 0.11, 0.07, 0.1, 'sine', 1750); break;
      case 'frog': this.tone(150, a, 0.13, 0.13, 'square', 120); this.tone(170, a + 0.18, 0.16, 0.13, 'square', 110); break;
      case 'fireflies': for (let i = 0; i < 6; i++) this.tone(1500 + ((i * 397) % 1100), a + i * 0.06, 0.2, 0.05, 'sine'); break;
      case 'whirr': this.tone(210, a, 0.26, 0.05, 'sawtooth', 520); this.tone(1318.5, a + 0.2, 0.22, 0.07, 'sine'); break;
      case 'slide': this.noise(a, 0.36, 0.08, 2400, 0.7); this.tone(300, a, 0.36, 0.1, 'sine', 950); break;
      case 'switch': this.tone(523.25, a, 0.09, 0.1, 'triangle'); this.tone(783.99, a + 0.08, 0.14, 0.1, 'triangle'); break;
      case 'ui': this.tone(660, a, 0.06, 0.08, 'triangle'); break;
      case 'brake': this.noise(a, 0.18, 0.08, 3200, 1.5); this.tone(700, a, 0.12, 0.05, 'triangle', 500); break;
      case 'fly': this.noise(a, 0.5, 0.06, 1800, 0.6); this.tone(330, a, 0.5, 0.06, 'sine', 660); break;
      case 'bunny': this.tone(1300, a, 0.07, 0.1, 'sine', 1750); this.tone(1400, a + 0.1, 0.07, 0.1, 'sine', 1850); break;
      case 'squirrel': for (let i = 0; i < 4; i++) this.tone(1800 + i * 120, a + i * 0.06, 0.05, 0.07, 'square', 1500); break;
      case 'penguin': this.tone(520, a, 0.12, 0.1, 'triangle', 380); this.tone(560, a + 0.16, 0.14, 0.1, 'triangle', 400); break;
      case 'fanfare': {
        const fs = [523.25, 659.25, 783.99, 1046.5];
        for (let i = 0; i < 4; i++) this.tone(fs[i], a + i * 0.15, 0.2, 0.14, 'triangle');
        for (let i = 0; i < 4; i++) this.tone(fs[i], a + 0.62, 0.9, 0.09, 'triangle');
        chime(a + 0.7, [1568, 2093, 2637], 0.06);
        break;
      }
      case 'sing': {   // Sunny's little song at the end
        const song = [5, 5, 7, 5, 8, 7, 5, 4, 5, 7, 9, 8, 7, 5];
        for (let i = 0; i < song.length; i++) this.tone(PENTA[song[i]], a + 0.9 + i * 0.22, 0.26, 0.12, 'triangle');
        break;
      }
      default: break;
    }
  },
  // Gentle pentatonic loop, scheduled a little ahead of time from the game loop.
  music: function () {
    if (!this.ready() || !Save.d.set.music) return;
    const c = this.ctx, step = 0.3;
    if (this.nextT < c.currentTime) this.nextT = c.currentTime + 0.06;
    let guard = 0;
    try {
      while (this.nextT < c.currentTime + 0.3 && guard++ < 6) {
        const i = this.pos, n = MEL[i];
        if (n >= 0) {
          this.tone(PENTA[n] * this.key, this.nextT, 0.5, 0.085, 'sine', 0, this.mus);
          this.tone(PENTA[n] * this.key * 2, this.nextT, 0.3, 0.014, 'triangle', 0, this.mus);
        }
        if (i % 4 === 0) this.tone(PENTA[BASS[(i / 4) | 0]] * this.key / 2, this.nextT, 1.0, 0.07, 'sine', 0, this.mus);
        this.pos = (i + 1) % MEL.length;
        this.nextT += step;
      }
    } catch (e) { /* ignore */ }
  }
};

/* "Read to me" uses the browser's own voice. If the browser has none, the toggle is hidden. */
const Speech = {
  ok: false,
  init: function () {
    try { this.ok = ('speechSynthesis' in window) && (typeof window.SpeechSynthesisUtterance === 'function'); }
    catch (e) { this.ok = false; }
  },
  say: function (text) {
    if (!this.ok || !Save.d.set.read || !text) return;
    try {
      const synth = window.speechSynthesis;
      synth.cancel();
      const u = new window.SpeechSynthesisUtterance(text);
      const want = Save.d.lang === 'fr' ? 'fr-CA' : 'en-US';
      u.lang = want; u.rate = 0.92; u.pitch = 1.12;
      const voices = synth.getVoices ? (synth.getVoices() || []) : [];
      let best = null;
      for (let i = 0; i < voices.length; i++) {
        const vl = String(voices[i].lang || '').replace('_', '-').toLowerCase();
        if (vl === want.toLowerCase()) { best = voices[i]; break; }
        if (!best && vl.indexOf(want.slice(0, 2)) === 0) best = voices[i];
      }
      if (best) u.voice = best;
      synth.speak(u);
    } catch (e) { /* ignore */ }
  },
  stop: function () {
    if (!this.ok) return;
    try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  }
};

const Input = {

  press: function (d, src) { this.release(src); this.held.push({ d: d, src: src }); this.buf = d; this.bufT = 0.45; },
  release: function (src) { this.held = this.held.filter(function (h) { return h.src !== src; }); },
  clear: function () { this.held = []; this.buf = -1; this.bufT = 0; qsa('#dpad .down').forEach(function (b) { b.classList.remove('down'); }); },
  dir: function () { return this.held.length ? this.held[this.held.length - 1].d : (this.bufT > 0 ? this.buf : -1); }
};

function buildLevel(i) {
  const def = LEVELS[i], h = def.map.length, w = def.map[0].length, n = w * h;
  const lv = {
    i: i, def: def, w: w, h: h, t: 0, base: [], raw: [],
    high: new Uint8Array(n), track: new Uint8Array(n), zone: new Uint8Array(n), tunnel: new Uint8Array(n), solid: new Uint8Array(n),
    vine: new Uint8Array(n), ice: new Uint8Array(n), snow: new Uint8Array(n),
    blocks: [], sockets: [], mush: [], gaps: [], bushes: [], buttons: [], gates: [], plates: [], calls: [], rafts: [], tunnels: [],
    vines: [], platforms: [],
    animal: null, key: null, acorn: null, treasure: null, stone: null, home: null, ids: {}, flags: {},
    chars: { S: mkChar('S', 1, 1), D: mkChar('D', 1, 2) }, active: 'S',
    fx: [], bubbles: [], pops: [], deco: [], hint: null, done: false, doneT: 0, outro: false, lit: def.theme !== 'cave',
    zoneCue: '', bloom: Save.d.stones[i] ? 1 : 0, snowToast: false, flyToast: false
  };
  const cnt = {};
  const mk = function (c, x, y, o) { const k = cnt[c] || 0; cnt[c] = k + 1; o.id = c + k; o.x = x; o.y = y; lv.ids[o.id] = o; return o; };
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const c = def.map[y].charAt(x), p = y * w + x;
      let b = '.';
      switch (c) {
        case '#': b = '#'; break;
        case 'F': b = 'F'; break;
        case '~': b = '~'; break;
        case 'x': b = 'x'; break;
        case '=': b = '='; break;
        case '1': lv.chars.S = mkChar('S', x, y); break;
        case '2': lv.chars.D = mkChar('D', x, y); break;
        case 'B': lv.blocks.push(mk('B', x, y, { locked: false, ax: x, ay: y, anim: null })); lv.track[p] = 1; break;
        case '_': lv.track[p] = 1; break;
        case 'O': lv.track[p] = 1; lv.sockets.push(mk('O', x, y, {})); break;
        case 'M': lv.mush.push(mk('M', x, y, { sq: 0 })); break;
        case 'G': b = '~'; lv.gaps.push(mk('G', x, y, { bridged: false, grow: 0 })); break;
        case 't': lv.tunnel[p] = 1; lv.tunnels.push(mk('t', x, y, {})); break;
        case 'v': lv.vine[p] = 1; lv.vines.push(mk('v', x, y, {})); break;
        case 'h': lv.bushes.push(mk('h', x, y, { open: false, shake: 0 })); break;
        case 'b': lv.buttons.push(mk('b', x, y, { pressed: false, lantern: false, kind: 'button', pa: 0 })); break;
        case 'l': b = '#'; lv.solid[p] = 1;
          lv.buttons.push(mk('b', x, y, { pressed: false, lantern: true, kind: def.theme === 'cave' ? 'lantern' : 'lever', pa: 0 })); break;
        case 'D': lv.gates.push(mk('D', x, y, { open: false, locked: false, a: 0 })); break;
        case 'K': lv.gates.push(mk('K', x, y, { open: false, locked: true, a: 0 })); break;
        case 'k': b = '~'; lv.solid[p] = 1; lv.key = { x: x, y: y, hx: x, hy: y, state: 'home', holder: '' }; break;
        case 'n': lv.solid[p] = 1; mk('n', x, y, {}); lv.acorn = { x: x, y: y, state: 'home' }; break;
        case 'c': lv.calls.push(mk('c', x, y, {})); break;
        case 'a': b = (def.animal && def.animal.base) || '.'; lv.solid[p] = 1; lv.home = { x: x, y: y }; break;
        case '*': lv.treasure = mk('*', x, y, { found: false }); break;
        case '$': lv.solid[p] = 1; lv.stone = { x: x, y: y, taken: false }; lv.ids.stone = lv.stone; break;
        case '+': lv.zone[p] = 1; break;
        case 'p': lv.plates.push(mk('p', x, y, { down: false })); break;
        case 'R': b = '~'; lv.rafts.push(mk('R', x, y, { ax: x, ay: y, anim: null })); break;
        case 'P': {
          b = 'x';
          const pd = (def.platforms || [])[lv.platforms.length] || { path: [[x, y], [x, y]] };
          lv.platforms.push(mk('P', x, y, { ax: x, ay: y, path: pd.path, at: 0, seg: 0, dir: 1, t: 0, moving: false, spin: 0 }));

      }
      lv.base[p] = b; lv.raw[p] = c;
    }
  }
  const ledges = def.ledges || [];
  for (let r = 0; r < ledges.length; r++) {
    const q = ledges[r], hv = q.length > 4 ? q[4] : 1;
    for (let y = q[1]; y <= q[3]; y++) for (let x = q[0]; x <= q[2]; x++) lv.high[y * w + x] = hv;
  }
  const ice = def.ice || [];
  for (let r = 0; r < ice.length; r++) {
    const q = ice[r];
    for (let y = q[1]; y <= q[3]; y++) for (let x = q[0]; x <= q[2]; x++) { if (lv.base[y * w + x] === '.') lv.ice[y * w + x] = 1; }
  }
  if (def.animal) {
    const p0 = def.animal.path[0];
    lv.animal = { kind: def.animal.kind, x: p0[0], y: p0[1], z: 0, state: 'sleep', seg: 0, t: 0, wig: 0, face: 0,
                  path: def.animal.path, speed: def.animal.kind === 'fireflies' ? 2.2 : (def.animal.kind === 'penguin' ? 2.4 : 3.2) };
  }
  // scenery: little flowers and tufts on plain ground (same every time for a given level)
  const rnd = rng(1000 + i * 77);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const p = y * w + x;
      if (lv.raw[p] !== '.' || lv.ice[p]) { rnd(); rnd(); rnd(); rnd(); continue; }
      const r1 = rnd(), r2 = rnd(), r3 = rnd(), r4 = rnd();
      if (r1 < 0.42) lv.deco.push({ x: x + 0.18 + r2 * 0.64, y: y + 0.18 + r3 * 0.64, kind: r1 < 0.24 ? 'flower' : 'tuft', v: r4 });
    }

}

/* =========================================================================
   8. WORLD AND COLLISION (part 2)  -  a simple tile grid, one step at a time
   ========================================================================= */
function inb(x, y) { return x >= 0 && y >= 0 && x < L.w && y < L.h; }
function at(x, y) { return y * L.w + x; }
function find(arr, x, y) { for (let i = 0; i < arr.length; i++) { if (arr[i].x === x && arr[i].y === y) return arr[i]; } return null; }
function charOn(x, y) {
  const s = L.chars.S, d = L.chars.D;
  if (s.x === x && s.y === y) return s;
  if (d.x === x && d.y === y) return d;
  return null;
}
function gapOpen(x, y) { const g = find(L.gaps, x, y); return (g && !g.bridged) ? g : null; }
function isSky(x, y) { return L.base[at(x, y)] === 'x'; }
function isWater(x, y) {                                    // water or open sky: you bounce back from these
  const b = L.base[at(x, y)];
  if (b !== '~' && b !== 'x') return false;
  const g = find(L.gaps, x, y);
  return !(g && g.bridged);
}
function platOn(x, y) { return find(L.platforms, x, y); }
function onIce(x, y) { const p = at(x, y); return !!L.ice[p] && !L.snow[p]; }
function isSolid(x, y) {                                    // nobody can ever stand here
  const b = L.base[at(x, y)];
  if (b === '#' || b === 'F') return true;
  if (L.solid[at(x, y)]) return true;
  const g = find(L.gates, x, y); if (g && !g.open) return true;
  const h = find(L.bushes, x, y); if (h && !h.open) return true;
  return false;
}
function heightAt(x, y) {
  const b = find(L.blocks, x, y);
  return L.high[at(x, y)] + ((b && b.locked) ? 0.5 : 0);   // a block on its glowing pad is a step
}
function standable(x, y) {                                  // a safe landing place for a bounce or a slide
  if (!inb(x, y) || isSolid(x, y) || isWater(x, y)) return false;
  const b = find(L.blocks, x, y); if (b && !b.locked) return false;
  if (find(L.mush, x, y) || L.tunnel[at(x, y)] || L.vine[at(x, y)]) return false;
  return true;
}
function platNext(pl) {                                     // the first tile the platform will fly over
  const i = pl.at, j = i === 0 ? 1 : i - 1, a = pl.path[i], b = pl.path[j];
  if (!b) return null;
  return [a[0] + Math.sign(b[0] - a[0]), a[1] + Math.sign(b[1] - a[1])];
}

// What would happen if this hero stepped from (x, y) in direction d?  Changes nothing.
function probe(who, x, y, d) {
  const dx = DX[d], dy = DY[d], tx = x + dx, ty = y + dy, S = (who === 'S');
  if (!inb(tx, ty)) return { k: 'block' };
  const bush = find(L.bushes, tx, ty);
  if (bush && !bush.open) return S ? { k: 'block', why: 'david', ox: tx, oy: ty } : { k: 'reveal', o: bush };
  const gate = find(L.gates, tx, ty);
  if (gate && !gate.open) {
    if (gate.locked) return L.chars[who].hasKey ? { k: 'unlock', o: gate } : { k: 'block', why: 'key', ox: tx, oy: ty };
    return { k: 'block', why: 'button', ox: tx, oy: ty };
  }
  if (isSolid(tx, ty)) return { k: 'block' };
  const blk = find(L.blocks, tx, ty);
  if (blk && !blk.locked) {
    if (!S) return { k: 'block', why: 'sophia', ox: tx, oy: ty };
    const bx = tx + dx, by = ty + dy;
    if (!blk.anim && inb(bx, by) && L.track[at(bx, by)] && !find(L.blocks, bx, by) && !charOn(bx, by)) {
      return { k: 'push', tx: tx, ty: ty, o: blk, bx: bx, by: by };
    }
    return { k: 'block' };
  }
  const m = find(L.mush, tx, ty);
  if (m) {
    if (!S) return { k: 'block', why: 'sophia', ox: tx, oy: ty, wig: m };
    if (standable(tx + dx, ty + dy)) return { k: 'bounce', tx: tx + dx, ty: ty + dy, o: m };
    return { k: 'block', wig: m };
  }
  const g = gapOpen(tx, ty);
  if (g) {
    if (!S) return { k: 'hazard', tx: tx, ty: ty, why: 'sophia' };
    if (standable(tx + dx, ty + dy)) return { k: 'slide', tx: tx + dx, ty: ty + dy, o: g };
    return { k: 'block' };
  }
  if (L.tunnel[at(tx, ty)]) return S ? { k: 'block', why: 'david', ox: tx, oy: ty } : { k: 'walk', tx: tx, ty: ty };
  if (S && L.vine[at(tx, ty)]) return { k: 'block', why: 'david', ox: tx, oy: ty };
  if (isWater(tx, ty)) {
    if (find(L.rafts, tx, ty)) return { k: 'walk', tx: tx, ty: ty };                 // step onto the raft
    const tp = platOn(tx, ty);
    if (tp) return tp.moving ? { k: 'wait' } : { k: 'walk', tx: tx, ty: ty };      // step onto the cloud platform
    const r = find(L.rafts, x, y);
    if (r) {
      if (!S) return { k: 'hazard', tx: tx, ty: ty, why: 'sophia' };
      if (r.anim) return { k: 'wait' };
      const o = (L.chars.S.x === x && L.chars.S.y === y) ? L.chars.D : L.chars.S;     // a friend still climbing aboard?
      if (o.x === x && o.y === y && o.anim) return { k: 'wait' };
      return { k: 'raft', tx: tx, ty: ty, o: r };
    }
    const mp = platOn(x, y);
    if (mp) {
      if (mp.moving) return { k: 'wait' };
      if (!S) return { k: 'hazard', tx: tx, ty: ty, why: 'sophia' };
      const nx = platNext(mp);
      if (nx && nx[0] === tx && nx[1] === ty) {
        const o = (L.chars.S.x === x && L.chars.S.y === y) ? L.chars.D : L.chars.S;
        if (o.x === x && o.y === y && o.anim) return { k: 'wait' };
        return { k: 'fly', o: mp };
      }
      return { k: 'hazard', tx: tx, ty: ty };
    }
    return { k: 'hazard', tx: tx, ty: ty };
  }
  if (!L.tunnel[at(x, y)]) {
    const hf = heightAt(x, y), ht = heightAt(tx, ty);
    const climb = !S && (L.vine[at(x, y)] || L.vine[at(tx, ty)]);   // David climbs vines and ladders
    if (climb && Math.abs(ht - hf) > 0.5) return { k: 'climb', tx: tx, ty: ty };
    if (ht - hf > 0.5) return { k: 'block', why: 'up', ox: tx, oy: ty };
    if (hf - ht > 0.5) return { k: 'hop', tx: tx, ty: ty };
  }
  return { k: 'walk', tx: tx, ty: ty };
}
// Where does David stop if he walks onto ice here? (He glides until something stops him.)
function iceEnd(x, y, d) {
  let cx = x, cy = y;
  for (let g = 0; g < 64 && onIce(cx, cy); g++) {
    const q = probe('D', cx, cy, d);
    if (q.k !== 'walk' || isWater(q.tx, q.ty)) break;
    cx = q.tx; cy = q.ty;
  }
  return [cx, cy];
}

// Tap-to-move: breadth-first search over the same rules. Never plans a step into water or sky.
function simStep(who, x, y, rs, d) {
  const tx = x + DX[d], ty = y + DY[d];
  if (!inb(tx, ty)) return null;
  if (who === 'S' && rs === 1) {                           // Sophia is riding the raft in this plan
    if (isSolid(tx, ty) || isSky(tx, ty)) return null;
    if (isWater(tx, ty)) return (gapOpen(tx, ty) || find(L.rafts, tx, ty)) ? null : [tx, ty, 1];
    return (standable(tx, ty) && heightAt(tx, ty) <= 0.5) ? [tx, ty, 2] : null;
  }
  const p = probe(who, x, y, d);
  if (p.k === 'walk' || p.k === 'hop' || p.k === 'bounce' || p.k === 'slide' || p.k === 'climb') {
    if (isWater(p.tx, p.ty)) {                             // boarding the raft or the cloud platform
      if (who !== 'S' || !find(L.rafts, p.tx, p.ty)) return [p.tx, p.ty, rs];
      return rs === 0 ? [p.tx, p.ty, 1] : null;
    }
    if (who === 'D' && p.k === 'walk' && onIce(p.tx, p.ty)) { const e = iceEnd(p.tx, p.ty, d); return [e[0], e[1], rs]; }
    return [p.tx, p.ty, rs];
  }
  return null;
}
function findPath(ch, gx, gy) {
  const W = L.w, N = W * L.h;
  const startRs = (ch.who === 'S' && find(L.rafts, ch.x, ch.y)) ? 1 : 0;
  const start = at(ch.x, ch.y) * 3 + startRs;
  const prev = new Int32Array(N * 3), pdir = new Int8Array(N * 3);
  for (let i = 0; i < prev.length; i++) prev[i] = -1;
  prev[start] = -2;
  const q = [start];
  let best = start, bestD = Math.abs(ch.x - gx) + Math.abs(ch.y - gy);
  for (let qi = 0; qi < q.length; qi++) {
    const node = q[qi], rs = node % 3, cell = (node - rs) / 3, x = cell % W, y = (cell - x) / W;
    const dist = Math.abs(x - gx) + Math.abs(y - gy);
    if (dist < bestD) { bestD = dist; best = node; }
    if (dist === 0) break;
    for (let d = 0; d < 4; d++) {
      const s = simStep(ch.who, x, y, rs, d);
      if (!s) continue;
      const nn = at(s[0], s[1]) * 3 + s[2];
      if (prev[nn] !== -1) continue;
      prev[nn] = node; pdir[nn] = d; q.push(nn);
    }
  }
  const path = [];
  for (let n = best; prev[n] >= 0; n = prev[n]) path.unshift(pdir[n]);
  if (bestD === 1) {                                        // finish by nudging the thing that was tapped
    const rs = best % 3, cell = (best - rs) / 3, bx = cell % W, by = (cell - bx) / W;
    for (let d = 0; d < 4; d++) { if (bx + DX[d] === gx && by + DY[d] === gy) path.push(d + 10); }
  }
  return path.length ? path : null;
}

/* ---------- heights in the 3D world ---------- */
function groundY(x, y) {                                    // the top of the floor of a tile
  if (!L || !inb(x, y)) return 0;
  const b = L.base[at(x, y)], hv = L.high[at(x, y)] * HS;
  if (b === '~') return hv - 0.16;
  return heightAt(x, y) * HS;
}
function standY(x, y) {                                     // where a hero's feet are on that tile
  if (!L || !inb(x, y)) return 0;
  if (find(L.rafts, x, y)) return L.high[at(x, y)] * HS - 0.02;
  if (platOn(x, y)) return L.high[at(x, y)] * HS + 0.02;
  if (find(L.gaps, x, y)) return L.high[at(x, y)] * HS;
  return groundY(x, y);
}

/* =========================================================================
   9. CHARACTERS  -  moving, special powers, animal friends
   ========================================================================= */
function speedOf(ch) { return ch.who === 'S' ? CONFIG.sophiaSpeed : CONFIG.davidSpeed; }
function startAnim(ch, kind, tx, ty, dur, extra) {
  ch.anim = { kind: kind, fx: ch.x, fy: ch.y, tx: tx, ty: ty, t: 0, dur: Math.max(0.06, dur), h0: standY(ch.x, ch.y), h1: standY(tx, ty) };
  if (extra) { for (const k in extra) ch.anim[k] = extra[k]; }
  ch.x = tx; ch.y = ty;
}
function spark(x, z, col, big, y) {                         // x, z: ground position; y: height (optional)
  if (!L || L.fx.length > 160) return;
  const a = Math.random() * TAU, sp = 0.5 + Math.random() * 1.0;
  const yy = (y === undefined) ? groundY(Math.floor(x), Math.floor(z)) + 0.45 : y;
  L.fx.push({ k: 'spark', x: x, y: yy, z: z, vx: Math.cos(a) * sp, vy: 0.9 + Math.random() * 1.4, vz: Math.sin(a) * sp,
              life: 0, max: 0.6 + Math.random() * 0.5, c: col || '#fff6a8', s: big ? 0.11 : 0.07 });
}
function burst(x, z, col, n, y) { for (let i = 0; i < n; i++) spark(x, z, col, i % 3 === 0, y); }
function powerFx(ch) {
  ch.power = 1;
  for (let i = 0; i < 6; i++) spark(ch.x + 0.5 + (Math.random() - 0.5) * 0.7, ch.y + 0.5 + (Math.random() - 0.5) * 0.7, '#8dffb0');
}
function bubble(x, y, icon) {
  for (let i = 0; i < L.bubbles.length; i++) { const b = L.bubbles[i]; if (b.x === x && b.y === y && b.icon === icon) { b.life = 0; return; } }
  L.bubbles.push({ x: x, y: y, icon: icon, life: 0, max: 1.8 });
}

function tryMove(ch, d) {
  ch.dir = d;
  const p = probe(ch.who, ch.x, ch.y, d);
  if (p.k !== 'block' && p.k !== 'wait') ch.bumpKey = '';
  switch (p.k) {
    case 'walk':
      startAnim(ch, 'walk', p.tx, p.ty, 1 / speedOf(ch)); Snd.sfx(ch.who === 'S' ? 'roll' : 'step'); break;
    case 'hop':
      startAnim(ch, 'hop', p.tx, p.ty, 0.42); Snd.sfx('hop'); break;
    case 'climb':
      startAnim(ch, 'climb', p.tx, p.ty, 0.5); Snd.sfx('hop'); break;
    case 'push': {
      const dur = 1 / (speedOf(ch) * 0.7);
      p.o.anim = { fx: p.o.x, fy: p.o.y, t: 0, dur: dur }; p.o.x = p.bx; p.o.y = p.by;
      startAnim(ch, 'push', p.tx, p.ty, dur); powerFx(ch); Snd.sfx('push'); break;
    }
    case 'bounce':
      p.o.sq = 1; startAnim(ch, 'bounce', p.tx, p.ty, 0.66); powerFx(ch); Snd.sfx('boing'); break;
    case 'slide':
      startAnim(ch, 'slide', p.tx, p.ty, 0.5); powerFx(ch); Snd.sfx('slide'); break;
    case 'raft': {
      const r = p.o, ox = r.x, oy = r.y, dur = 0.55;
      r.anim = { fx: ox, fy: oy, t: 0, dur: dur }; r.x = p.tx; r.y = p.ty;
      const other = ch.who === 'S' ? L.chars.D : L.chars.S;
      if (other.x === ox && other.y === oy && !other.anim) { other.path = null; startAnim(other, 'ride', p.tx, p.ty, dur); }
      startAnim(ch, 'ride', p.tx, p.ty, dur); powerFx(ch); Snd.sfx('splash'); break;
    }
    case 'fly':
      flyPlatform(p.o, ch); break;
    case 'hazard':
      ch.anim = { kind: 'boing', fx: ch.x, fy: ch.y, hx: p.tx, hy: p.ty, t: 0, dur: 0.8, sp: 0, h0: standY(ch.x, ch.y), h1: standY(ch.x, ch.y) };
      ch.path = null; if (p.why) bubble(p.tx, p.ty, p.why); break;
    case 'reveal':
      revealBush(p.o); ch.anim = { kind: 'bump', fx: ch.x, fy: ch.y, d: d, t: 0, dur: 0.3, h0: standY(ch.x, ch.y), h1: standY(ch.x, ch.y) }; break;
    case 'unlock':
      unlockGate(p.o, ch); ch.anim = { kind: 'bump', fx: ch.x, fy: ch.y, d: d, t: 0, dur: 0.3, h0: standY(ch.x, ch.y), h1: standY(ch.x, ch.y) }; break;
    case 'wait':
      break;
    default: {                                              // blocked: a soft nudge, and a picture of who can help
      ch.anim = { kind: 'bump', fx: ch.x, fy: ch.y, d: d, t: 0, dur: 0.26, h0: standY(ch.x, ch.y), h1: standY(ch.x, ch.y) };
      const key = d + ':' + ch.x + ':' + ch.y;
      if (key !== ch.bumpKey || ch.bumpT <= 0) {
        ch.bumpKey = key; ch.bumpT = 1.5;
        if (p.wig) { p.wig.sq = 0.6; Snd.sfx('hop'); } else Snd.sfx('bump');
        if (p.why && p.why !== 'up') bubble(p.ox, p.oy, p.why);
        else if (p.why === 'up' && ch.who === 'S' && L.mush.length) bubble(p.ox, p.oy, 'mushroom');
        else if (p.why === 'up' && ch.who === 'D' && L.vines.length) bubble(p.ox, p.oy, 'vine');
      }
      break;
    }
  }
  return p.k;
}

// The cloud platform only flies when Sophia's walker powers it.
function flyPlatform(pl, ch) {
  if (pl.moving || ch.who !== 'S') return;
  pl.moving = true; pl.dir = pl.at === 0 ? 1 : -1; pl.seg = pl.at; pl.t = 0;
  const s = L.chars.S, d = L.chars.D;
  [s, d].forEach(function (c) { if (c.x === pl.x && c.y === pl.y && !c.anim) { c.ride = pl; c.path = null; } });
  powerFx(ch); Snd.sfx('whirr'); Snd.sfx('fly');
  if (!L.flyToast) { L.flyToast = true; toast('platform', 't_fly'); }
}
function updatePlatforms(dt) {
  for (let i = 0; i < L.platforms.length; i++) {
    const pl = L.platforms[i];
    pl.spin += dt * (pl.moving ? 14 : 1.5);
    if (!pl.moving) continue;
    const a = pl.path[pl.seg], b = pl.path[pl.seg + pl.dir];
    const len = Math.max(1, Math.abs(b[0] - a[0]) + Math.abs(b[1] - a[1]));
    pl.t += dt * CONFIG.platformSpeed / len;
    const u = Math.min(1, pl.t), e = u * u * (3 - 2 * u);
    pl.ax = lerp(a[0], b[0], e); pl.ay = lerp(a[1], b[1], e);
    pl.x = Math.round(pl.ax); pl.y = Math.round(pl.ay);
    const riders = [L.chars.S, L.chars.D].filter(function (c) { return c.ride === pl; });
    for (let k = 0; k < riders.length; k++) {
      const c = riders[k]; c.x = pl.x; c.y = pl.y; c.px = pl.ax; c.py = pl.ay; c.hy = L.high[at(pl.x, pl.y)] * HS + 0.02;
    }
    if (Math.random() < 0.5) spark(pl.ax + 0.5 + (Math.random() - 0.5) * 0.8, pl.ay + 0.5 + (Math.random() - 0.5) * 0.8, '#ffffff', false, L.high[at(pl.x, pl.y)] * HS - 0.1);
    if (pl.t >= 1) {
      pl.seg += pl.dir; pl.t = 0;
      if (pl.seg <= 0 || pl.seg >= pl.path.length - 1) {
        pl.moving = false; pl.at = pl.seg; pl.ax = b[0]; pl.ay = b[1]; pl.x = b[0]; pl.y = b[1];
        L.flags[pl.id] = true; Snd.sfx('small');
        for (let k = 0; k < riders.length; k++) { const c = riders[k]; c.ride = null; c.x = pl.x; c.y = pl.y; c.px = pl.x; c.py = pl.y; arrive(c, 'ride'); }
      }
    }
  }
}

function arrive(ch, kind) {
  // David glides on ice until something stops him. Sophia's walker is a super brake.
  if (ch.who === 'D' && (kind === 'walk' || kind === 'ice') && onIce(ch.x, ch.y)) {
    const p = probe('D', ch.x, ch.y, ch.dir);
    if (p.k === 'walk' && !isWater(p.tx, p.ty)) {
      startAnim(ch, 'ice', p.tx, p.ty, 1 / CONFIG.iceSpeed);
      if (kind === 'walk') Snd.sfx('slide');
      spark(ch.px + 0.5, ch.py + 0.5, '#e8fbff');
      return;
    }
  }
  if (ch.who === 'S' && L.ice[at(ch.x, ch.y)] && !L.snow[at(ch.x, ch.y)] && kind === 'walk') {
    ch.brake = 1; Snd.sfx('brake');
    for (let i = 0; i < 3; i++) spark(ch.x + 0.5 + DX[ch.dir] * 0.3, ch.y + 0.5 + DY[ch.dir] * 0.3, '#e8fbff');
  }
  ch.safe.x = ch.x; ch.safe.y = ch.y;                       // the last safe spot
  const b = find(L.buttons, ch.x, ch.y);
  if (b && !b.pressed && !b.lantern) pressButton(b);
  const key = L.key;
  if (key && key.state === 'ground' && key.x === ch.x && key.y === ch.y) takeKey(ch);
  const tr = L.treasure;
  if (ch.who === 'D' && tr && !tr.found && tr.x === ch.x && tr.y === ch.y) findTreasure();
}

function updateChar(ch, dt) {
  ch.idle += dt;
  if (ch.power > 0) ch.power = Math.max(0, ch.power - dt * 1.4);
  if (ch.cheer > 0) ch.cheer = Math.max(0, ch.cheer - dt);
  if (ch.brake > 0) ch.brake = Math.max(0, ch.brake - dt * 2);
  if (ch.bumpT > 0) ch.bumpT -= dt;
  if (ch.ride) { if (ch.who === 'S') ch.wheel += dt * 14; return; }   // flying on the cloud platform
  const a = ch.anim;
  if (a) {
    a.t += dt / a.dur;
    const u = Math.min(1, a.t);
    if (a.kind === 'boing') {                               // oops! a gentle splash and a bounce back
      if (u < 0.4) { const v = u / 0.4; ch.px = lerp(a.fx, a.hx, v * 0.62); ch.py = lerp(a.fy, a.hy, v * 0.62); ch.z = -0.16 * v; }
      else { const v = (u - 0.4) / 0.6; ch.px = lerp(lerp(a.fx, a.hx, 0.62), a.fx, v); ch.py = lerp(lerp(a.fy, a.hy, 0.62), a.fy, v); ch.z = Math.sin(v * Math.PI) * 0.75 - 0.16 * (1 - v) * (1 - v); }
      ch.hy = a.h0;
      if (!a.sp && u >= 0.4) {
        a.sp = 1; Snd.sfx('splash'); Snd.sfx('boing');
        const cl = isSky(a.hx, a.hy) ? '#ffffff' : (isWater(a.hx, a.hy) ? '#d9f4ff' : '#fff6a8');
        for (let i = 0; i < 9; i++) spark(a.hx + 0.5, a.hy + 0.5, cl, false, a.h0);
      }
    } else if (a.kind === 'bump') {
      const v = Math.sin(u * Math.PI) * 0.12; ch.px = a.fx + DX[a.d] * v; ch.py = a.fy + DY[a.d] * v; ch.z = 0; ch.hy = a.h0;
    } else {
      const e = (a.kind === 'slide' || a.kind === 'climb') ? u * u * (3 - 2 * u) : u;
      ch.px = lerp(a.fx, a.tx, e); ch.py = lerp(a.fy, a.ty, e);
      ch.hy = lerp(a.h0, a.h1, a.kind === 'hop' ? u * u : e);
      if (a.kind === 'walk') ch.z = ch.who === 'D' ? Math.sin(u * Math.PI) * 0.12 : 0;
      else if (a.kind === 'hop') ch.z = Math.sin(u * Math.PI) * 0.34;
      else if (a.kind === 'bounce') ch.z = Math.sin(u * Math.PI) * 0.95;
      else if (a.kind === 'climb') ch.z = Math.sin(u * Math.PI) * 0.15;
      else if (a.kind === 'slide') { ch.z = Math.sin(u * Math.PI) * 0.07; if (Math.random() < 0.5) spark(ch.px + 0.5, ch.py + 0.5, '#8dffb0', false, ch.hy + 0.1); }
      else ch.z = 0;
      if (ch.who === 'S') ch.wheel += dt * (a.kind === 'slide' ? 26 : 9);
    }
    if (a.t < 1) return;
    ch.anim = null; ch.px = ch.x; ch.py = ch.y; ch.z = 0; ch.hy = standY(ch.x, ch.y);
    if (a.kind !== 'bump' && a.kind !== 'boing') arrive(ch, a.kind);
    if (ch.anim) return;                                     // still gliding on the ice
  } else {
    ch.hy = standY(ch.x, ch.y);
    if (ch.who === 'S' && ch.power > 0) ch.wheel += dt * 22 * ch.power;
  }
  if (L.done) return;
  if (ch.who === L.active) {
    const d = Input.dir();
    if (d >= 0) { ch.path = null; Input.buf = -1; Input.bufT = 0; tryMove(ch, camDir(d)); return; }
  }
  if (ch.path && ch.path.length) {
    let st = ch.path.shift();
    if (st >= 10) {                                         // final nudge of a tap: never into a hazard
      st -= 10;
      const pk = probe(ch.who, ch.x, ch.y, st).k;
      ch.path = null;
      if (pk === 'hazard' || pk === 'walk' || pk === 'hop' || pk === 'climb') return;
      tryMove(ch, st);
      return;
    }
    const k = tryMove(ch, st);
    if (k === 'wait') { ch.path.unshift(st); return; }
    if (k === 'block' || k === 'hazard' || k === 'reveal' || k === 'unlock' || k === 'fly') ch.path = null;
  }
}

/* ---------- things that happen in the world ---------- */
function toast(icon, key, extra) {
  const text = t(key) + (extra ? ' ' + extra : '');
  const ic = $('toastIc');
  ic.setAttribute('data-icon', icon); drawIconEl(ic);
  $('toastTx').textContent = text;
  $('toast').classList.remove('hidden');
  G.toastT = 4.5;
  Speech.say(text);
}
function activate(id, quiet) {
  const o = L.ids[id];
  if (!o) return;
  if (id.charAt(0) === 'G') {
    o.bridged = true; L.flags[id] = true; Snd.sfx('chime'); burst(o.x + 0.5, o.y + 0.5, '#ffe14a', 14); if (!quiet) toast('gap', 't_bridge');
  } else {
    o.open = true; L.flags[id] = true; Snd.sfx('gate'); burst(o.x + 0.5, o.y + 0.5, '#fff6a8', 14); if (!quiet) toast('gate', 't_gate');
  }
}
function pressButton(b) {
  if (b.pressed) return;
  b.pressed = true; L.flags[b.id] = true; Snd.sfx('click');
  burst(b.x + 0.5, b.y + 0.5, '#fff6a8', 8);
  if (b.kind === 'lantern') { L.lit = true; toast('fireflies', 't_light'); }
  if (b.kind === 'lever') { if (L.acorn) L.acorn.state = 'used'; toast('lever', 't_lever'); }
  const target = L.def.links[b.id];
  if (target) activate(target, b.lantern);
}
function revealBush(b) {
  b.open = true; b.shake = 1; L.flags[b.id] = true; Snd.sfx('chime');
  burst(b.x + 0.5, b.y + 0.5, '#b9f29a', 16); toast('bush', 't_path');
  L.chars.D.cheer = 0.6;
}
function takeKey(ch) {
  L.key.state = 'held'; L.key.holder = ch.who; ch.hasKey = true; L.flags.key = true;
  Snd.sfx('chime'); burst(ch.x + 0.5, ch.y + 0.5, '#ffe14a', 12); toast('key', 't_key');
}
function unlockGate(g, ch) {
  g.locked = false; g.open = true; L.flags[g.id] = true; ch.hasKey = false;
  if (L.key) L.key.state = 'used';
  Snd.sfx('gate'); burst(g.x + 0.5, g.y + 0.5, '#ffe14a', 16); toast('key', 't_unlock');
}
function findTreasure() {
  const tr = L.treasure;
  tr.found = true; Save.d.treasures[L.i] = 1; Save.store();
  Snd.sfx('chime'); burst(tr.x + 0.5, tr.y + 0.5, '#fff6a8', 18);
  L.pops.push({ x: tr.x + 0.5, z: tr.y + 0.5, y: groundY(tr.x, tr.y) + 0.9, life: 0, max: 2.2, icon: L.def.treasure });
  L.chars.D.cheer = 1;
  toast(L.def.treasure, 't_treasure', t(L.def.treasure));
}
function lockBlock(b) {
  b.locked = true; L.flags[b.id] = true; Snd.sfx('chime');
  burst(b.x + 0.5, b.y + 0.5, '#ffe14a', 16);
  const s = find(L.sockets, b.x, b.y), ln = L.def.links;
  if (s) L.flags[s.id] = true;
  let opened = false;
  if (s && ln[s.id]) { activate(ln[s.id], true); opened = true; }
  if (ln.sockets && !L.flags.sockets) {
    let all = true;
    for (let i = 0; i < L.sockets.length; i++) { const bl = find(L.blocks, L.sockets[i].x, L.sockets[i].y); if (!(bl && bl.locked)) all = false; }
    if (all) { L.flags.sockets = true; activate(ln.sockets, true); opened = true; }
  }
  if (opened) toast('gate', 't_gate');
  else if (ln.sockets) toast('socket', 't_pad');
  else toast('block', 't_block');
}
function animalEvent(ev) {
  const a = L.animal;
  if (ev === 'pick') { if (L.key) L.key.state = 'carried'; Snd.sfx('small'); }
  else if (ev === 'pickA') { if (L.acorn) L.acorn.state = 'carried'; Snd.sfx('small'); toast('acorn', 't_acorn'); }
  else if (ev === 'drop') {
    const key = L.key;
    if (key) {
      key.state = 'ground'; key.x = Math.round(a.x); key.y = Math.round(a.y);
      const d = L.chars.D, s = L.chars.S;
      if (d.x === key.x && d.y === key.y) takeKey(d);
      else if (s.x === key.x && s.y === key.y) takeKey(s);
      else Snd.sfx('small');
    }
  } else if (ev.indexOf('press:') === 0) {
    const b = L.ids[ev.slice(6)];
    if (b) pressButton(b);
  }
}
function startAnimal() {
  const a = L.animal;
  a.state = 'go'; a.seg = 0; a.t = 0; a.wig = 1;
  Snd.sfx(a.kind);
}
function updateAnimal(dt) {
  const a = L.animal;
  if (!a) return;
  if (a.wig > 0) a.wig = Math.max(0, a.wig - dt * 1.5);
  if (a.state !== 'go') return;
  const p0 = a.path[a.seg], p1 = a.path[a.seg + 1];
  const dist = Math.max(0.5, Math.sqrt((p1[0] - p0[0]) * (p1[0] - p0[0]) + (p1[1] - p0[1]) * (p1[1] - p0[1])));
  a.t += dt * a.speed / dist;
  const u = Math.min(1, a.t), hops = Math.max(1, Math.round(dist / 1.3));
  a.x = lerp(p0[0], p1[0], u); a.y = lerp(p0[1], p1[1], u);
  a.face = Math.atan2(p1[0] - p0[0], p1[1] - p0[1]);
  a.z = a.kind === 'fireflies' ? 0 : (a.kind === 'penguin' ? Math.abs(Math.sin(u * Math.PI * dist * 2)) * 0.06 : Math.abs(Math.sin(u * Math.PI * hops)) * 0.36);
  if (a.kind === 'fireflies' && Math.random() < 0.3) spark(a.x + 0.5, a.y + 0.5, '#fff6a8');
  if (L.def.animal.lights) {                                // the penguin leaves a glowing snowy path on the ice
    const cx = Math.round(a.x), cy = Math.round(a.y);
    if (inb(cx, cy) && L.ice[at(cx, cy)] && !L.snow[at(cx, cy)]) {
      L.snow[at(cx, cy)] = 1; burst(cx + 0.5, cy + 0.5, '#ffffff', 5); Snd.sfx('small');
    }
  }
  if (a.t >= 1) {
    a.seg++; a.t = 0; a.z = 0;
    const ev = L.def.animal.events[a.seg];
    if (ev) animalEvent(ev);
    if (a.seg >= a.path.length - 1) {
      a.state = 'done'; L.flags.animal = true;
      if (L.def.animal.lights && !L.snowToast) { L.snowToast = true; toast('snow', 't_snow'); }
    }
  }
}

/* ---------- the action button ---------- */
function doAction() {
  if (!L || L.done || G.overlay || G.screen !== 'game') return;
  const ch = L.chars[L.active];
  if (ch.anim || ch.ride) return;
  ch.path = null;
  if (ch.who === 'S') {
    // Walker Power: push, bounce, slide, paddle or fly whatever is straight ahead.
    const pl = platOn(ch.x, ch.y);
    if (pl && !pl.moving) { flyPlatform(pl, ch); return; }
    const k = probe('S', ch.x, ch.y, ch.dir).k;
    if (k === 'push' || k === 'bounce' || k === 'slide' || k === 'raft' || k === 'unlock' || k === 'fly') { tryMove(ch, ch.dir); return; }
    powerFx(ch); Snd.sfx('whirr');
    ch.anim = { kind: 'bump', fx: ch.x, fy: ch.y, d: ch.dir, t: 0, dur: 0.3, h0: standY(ch.x, ch.y), h1: standY(ch.x, ch.y) };
    return;
  }
  // Little Explorer: find treasure, open secret paths, call animal friends.
  const cheb = function (o) { return Math.max(Math.abs(o.x - ch.x), Math.abs(o.y - ch.y)); };
  const tr = L.treasure, a = L.animal;
  const whistle = function () {
    ch.cheer = 0.5; Snd.sfx('whistle');
    const y0 = standY(ch.x, ch.y) + 1.0;
    for (let i = 0; i < 3; i++) L.fx.push({ k: 'note', x: ch.x + 0.5 + (i - 1) * 0.22, y: y0, z: ch.y + 0.5, vx: (i - 1) * 0.25, vy: 0.8 + i * 0.15, vz: 0, life: 0, max: 1.3, c: '#2b2350', s: 0.08 });
  };
  if (a && a.state === 'sleep' && find(L.calls, ch.x, ch.y)) { whistle(); startAnimal(); return; }   // standing right on the paw print
  if (tr && !tr.found && cheb(tr) <= 1) { findTreasure(); return; }
  for (let i = 0; i < L.bushes.length; i++) {
    const b = L.bushes[i];
    if (!b.open && Math.abs(b.x - ch.x) + Math.abs(b.y - ch.y) === 1) { revealBush(b); return; }
  }
  if (ch.hasKey) {
    for (let d = 0; d < 4; d++) {
      const g = inb(ch.x + DX[d], ch.y + DY[d]) ? find(L.gates, ch.x + DX[d], ch.y + DY[d]) : null;
      if (g && g.locked) { ch.dir = d; unlockGate(g, ch); return; }
    }
  }
  whistle();
  if (platOn(ch.x, ch.y)) bubble(ch.x, ch.y, 'sophia');     // the cloud needs Sophia's walker to fly
  if (!a) return;
  let near = false;
  for (let i = 0; i < L.calls.length; i++) { if (cheb(L.calls[i]) <= 1) near = true; }
  if (near && a.state === 'sleep') { startAnimal(); return; }
  a.wig = 1;                                                // the friend hears David and wiggles
  if (a.state === 'sleep' && L.calls.length) L.hint = { at: [L.calls[0].id], t: 6 };
}

function setActive(who, quiet) {
  if (!L) return;
  L.active = who;
  document.body.classList.toggle('who-D', who === 'D');
  $('bS').classList.toggle('active', who === 'S'); $('bS').setAttribute('aria-pressed', who === 'S' ? 'true' : 'false');
  $('bD').classList.toggle('active', who === 'D'); $('bD').setAttribute('aria-pressed', who === 'D' ? 'true' : 'false');
  const ic = $('actIc'); ic.setAttribute('data-icon', who === 'S' ? 'walker' : 'paw'); drawIconEl(ic);
  if (!quiet) {
    const ch = L.chars[who];
    Snd.sfx('switch'); ch.cheer = Math.max(ch.cheer, 0.45);
    L.fx.push({ k: 'ring', x: ch.px + 0.5, y: ch.hy + 0.03, z: ch.py + 0.5, vx: 0, vy: 0, vz: 0, life: 0, max: 0.6, c: '#ffd92e', s: 1 });
  }
}

function tapTile(tx, ty) {
  if (!L || L.done || !Save.d.set.tap || !inb(tx, ty)) return;
  const ch = L.chars[L.active];
  if (ch.ride) return;
  G.tap = { x: tx, y: ty, t: 0.7 };
  ch.path = findPath(ch, tx, ty);
}

function currentHint() {
  const hs = L.def.hints;
  for (let i = 0; i < hs.length; i++) { if (!hs[i].until || !L.flags[hs[i].until]) return hs[i]; }
  return hs[hs.length - 1];
}
function showHint() {
  if (G.screen !== 'game' || G.overlay || !L || L.done) return;
  const h = currentHint();
  L.hint = { at: h.at, t: 14 };
  Snd.sfx('ui');
  Dlg.show([{ k: h.k, pic: h.pic }]);
}

function completeLevel() {
  const i = L.i, s = L.chars.S, d = L.chars.D;
  L.done = true; L.doneT = 0; L.stone.taken = true;
  s.cheer = 3; d.cheer = 3; s.path = null; d.path = null;
  Save.d.stones[i] = 1;
  if (i === 4) Save.d.won5 = 1;
  if (i < LEVELS.length - 1) { if (Save.d.unlocked < i + 1) Save.d.unlocked = i + 1; Save.d.level = i + 1; }
  else { Save.d.won = 1; Save.d.level = 0; }
  Save.store();
  Snd.sfx('fanfare');
  burst(L.stone.x + 0.5, L.stone.y + 0.5, STONES[i].c, 26, groundY(L.stone.x, L.stone.y) + 0.8);
  spawnConfetti(Save.d.set.calm ? 18 : 70);
  updateHud();
}

function spawnConfetti(n) {                                 // confetti falls around the camera's target
  const c = Cam.tgt;
  for (let i = 0; i < n && G.confetti.length < 240; i++) {
    G.confetti.push({ x: c[0] + (Math.random() - 0.5) * 12, y: c[1] + 5 + Math.random() * 5, z: c[2] + (Math.random() - 0.5) * 10,
      vx: (Math.random() - 0.5) * 0.6, vy: -1.1 - Math.random() * 0.9, r: Math.random() * TAU, vr: (Math.random() - 0.5) * 6,
      c: RAINBOW[i % RAINBOW.length], s: 0.07 + Math.random() * 0.06 });
  }
}

/* ---------- one fixed step of the game (1/60 of a second) ---------- */
function update(dt) {
  G.time += dt;
  Snd.music();
  for (let i = G.confetti.length - 1; i >= 0; i--) {
    const c = G.confetti[i];
    c.x += (c.vx + Math.sin(G.time * 2 + c.s * 90) * 0.3) * dt; c.y += c.vy * dt; c.r += c.vr * dt;
    if (c.y < Cam.tgt[1] - 3) G.confetti.splice(i, 1);
  }
  if (G.toastT > 0) { G.toastT -= dt; if (G.toastT <= 0) $('toast').classList.add('hidden'); }
  if (G.tap) { G.tap.t -= dt; if (G.tap.t <= 0) G.tap = null; }
  if (Input.bufT > 0) Input.bufT -= dt;
  Cam.update(dt);
  if (G.screen === 'end') {
    G.endT += dt;
    if (Math.random() < (Save.d.set.calm ? 0.05 : 0.4)) spawnConfetti(1);
    return;
  }
  if (G.screen !== 'game' || !L || G.overlay) return;       // menus and story pause the world
  L.t += dt;

  for (let i = 0; i < L.blocks.length; i++) {               // blocks sliding along their track
    const b = L.blocks[i];
    if (b.anim) {
      b.anim.t += dt / b.anim.dur;
      const u = Math.min(1, b.anim.t);
      b.ax = lerp(b.anim.fx, b.x, u); b.ay = lerp(b.anim.fy, b.y, u);
      if (b.anim.t >= 1) {
        b.anim = null; b.ax = b.x; b.ay = b.y;
        if (find(L.sockets, b.x, b.y)) lockBlock(b);
      }
    }
  }
  for (let i = 0; i < L.rafts.length; i++) {
    const r = L.rafts[i];
    if (r.anim) {
      r.anim.t += dt / r.anim.dur;
      const u = Math.min(1, r.anim.t);
      r.ax = lerp(r.anim.fx, r.x, u); r.ay = lerp(r.anim.fy, r.y, u);
      if (r.anim.t >= 1) { r.anim = null; r.ax = r.x; r.ay = r.y; }
    }
  }
  updatePlatforms(dt);
  updateChar(L.chars.S, dt);
  updateChar(L.chars.D, dt);
  updateAnimal(dt);

  for (let i = 0; i < L.mush.length; i++) { if (L.mush[i].sq > 0) L.mush[i].sq = Math.max(0, L.mush[i].sq - dt * 2.4); }
  for (let i = 0; i < L.gaps.length; i++) { if (L.gaps[i].bridged && L.gaps[i].grow < 1) L.gaps[i].grow = Math.min(1, L.gaps[i].grow + dt * 1.6); }
  for (let i = 0; i < L.gates.length; i++) { if (L.gates[i].open && L.gates[i].a < 1) L.gates[i].a = Math.min(1, L.gates[i].a + dt * 1.6); }
  for (let i = 0; i < L.bushes.length; i++) { if (L.bushes[i].shake > 0) L.bushes[i].shake = Math.max(0, L.bushes[i].shake - dt * 1.5); }
  for (let i = 0; i < L.buttons.length; i++) { const b = L.buttons[i]; if (b.pressed && b.pa < 1) b.pa = Math.min(1, b.pa + dt * 3); }

  if (L.plates.length && !L.flags.plates) {                 // magic tiles: every one needs a hero at the same time
    let all = true;
    for (let i = 0; i < L.plates.length; i++) {
      const p = L.plates[i], was = p.down;
      const c = charOn(p.x, p.y);
      p.down = !!c && !c.anim && !c.ride;
      if (p.down && !was) Snd.sfx('click');
      if (!p.down) all = false;
    }
    if (all) {
      L.flags.plates = true;
      const target = L.def.links.plates;
      if (target) activate(target);
    }
  }

  for (let i = L.fx.length - 1; i >= 0; i--) {
    const f = L.fx[i];
    f.life += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
    if (f.k === 'spark') f.vy -= 3.2 * dt;
    if (f.life >= f.max) L.fx.splice(i, 1);
  }
  for (let i = L.pops.length - 1; i >= 0; i--) { const p = L.pops[i]; p.life += dt; p.y += dt * 0.5; if (p.life >= p.max) L.pops.splice(i, 1); }
  for (let i = L.bubbles.length - 1; i >= 0; i--) { L.bubbles[i].life += dt; if (L.bubbles[i].life >= L.bubbles[i].max) L.bubbles.splice(i, 1); }
  if (L.hint) { L.hint.t -= dt; if (L.hint.t <= 0) L.hint = null; }
  if (L.bloom > 0 && L.bloom < 1) L.bloom = Math.min(1, L.bloom + dt * 0.8);

function linkColor(id) {                                    // match a gate to its button's color
  const links = L.def.links;
  for (let i = 0; i < L.buttons.length; i++) { if (links[L.buttons[i].id] === id) return i % LINKC.length; }
  if (links.plates === id || links.sockets === id) return 1;

  return 0;
}

function buildWorldMesh(lv) {

  const deep = sea ? -6 : -0.6;

    if (x < 0 || y < 0 || x >= w || y >= h) return sea ? deep : 0;
    const bb = lv.base[y * w + x], hv = lv.high[y * w + x] * HS;
    if (bb === 'x') return deep;

    for (let x = 0; x < w; x++) {
      const p = y * w + x, bb = lv.base[p], raw = lv.raw[p], yt = topOf(x, y), hi = lv.high[p] > 0;
      if (bb === 'x') continue;
      if (bb === '~' || bb === '=') {                       // water surface (animated)
        const wy = lv.high[p] * HS - 0.16;
        b.tex(th.water).col(th.waterTint || '#ffffff'); b.an = 1;
        b.quad([x, wy, y + 1], [x + 1, wy, y + 1], [x + 1, wy, y], [x, wy, y], [0, 1, 0]);
        b.an = 0;
        if (bb === '=') {
          const vert = y > 0 && y + 1 < h && lv.base[p - w] !== '~' && lv.base[p + w] !== '~' && (lv.base[p - 1] === '~' || lv.base[p + 1] === '~');
          b.push().tr(x + 0.5, wy + 0.06, y + 0.5).ry(vert ? Math.PI / 2 : 0); MODELS.planks(b); b.pop();
        }
      } else {
        const top = lv.ice[p] ? 'ice' : (hi ? th.top2 : th.top);
        b.tex(top).col('#ffffff');
        b.quad([x, yt, y + 1], [x + 1, yt, y + 1], [x + 1, yt, y], [x, yt, y], [0, 1, 0]);
      }

      for (let k = 0; k < 4; k++) {

          b.col('#5cc455'); for (let r = 0.05; r < hh; r += 0.2) { b.push().tr(r * 3 % 0.5 - 0.25, r, 0.04).sc(1, 0.5, 0.4).sph(0.07, 5, 3).pop(); }

    if (k === 'rabbit' || k === 'bunny') { b.tex(k === 'bunny' ? 'candy' : 'dirt').col('#ffffff').push().sc(1, 0.5, 1).sph(0.42, 8, 4, function (xx, yy) { return yy > -0.1; }).pop(); b.tex('plain').col('#3a2614').push().tr(0, 0.06, 0.3).rx(-1.2).disc(0.15, 8, 0).pop(); }

// Swipe on the picture to turn the camera; a short tap walks there instead.
const Drag = {
  id: -1, x0: 0, y0: 0, yaw0: 0, moved: false,

  move: function (e) {

    if (this.moved) Cam.yawT = this.yaw0 - dx * 0.008;
  },
  up: function (e) {
    if (e.pointerId !== this.id) return;
    this.id = -1;
    if (this.moved) { Cam.turn(0); Snd.sfx('switch'); return; }      // settle on the nearest quarter turn
    const tile = GLR.pick(e.clientX, e.clientY);
    if (tile) tapTile(tile[0], tile[1]);

  cancel: function () { if (this.id >= 0 && this.moved) Cam.turn(0); this.id = -1; this.moved = false; }
};

      if (k === 'h' || k === 'H') { showHint(); return; }
      if (k === 'c' || k === 'C') { Cam.reset(); Snd.sfx('ui'); return; }
      if (k === 'q' || k === 'Q') { Cam.turn(1); Snd.sfx('switch'); return; }
      if (k === 'r' || k === 'R') { Cam.turn(-1); Snd.sfx('switch'); return; }
      if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); Snd.sfx('ui'); openOv('pause'); return; }
      return;
    }
    if (k === 'Escape') { e.preventDefault(); if (G.overlay) { Snd.sfx('ui'); closeOv(); } return; }
    const isRange = document.activeElement && document.activeElement.tagName === 'INPUT';
    const d = keyDir(e);
    if (e.code && e.code.indexOf('Key') === 0) return;      // letters do nothing in menus
    if (d === 0 || (d === 3 && !isRange)) { e.preventDefault(); navFocus(-1); }
    else if (d === 2 || (d === 1 && !isRange)) { e.preventDefault(); navFocus(1); }
  });
  window.addEventListener('keyup', function (e) {
    const d = keyDir(e);
    if (d >= 0) Input.release('key' + d);
    if ((e.key === ' ' || e.code === 'Space') && G.screen === 'game' && !G.overlay) e.preventDefault();
  });
  window.addEventListener('blur', autoPause);                // pause when the window or tab loses focus
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { autoPause(); Snd.suspend(); Speech.stop(); }
    else if (Snd.ctx) Snd.unlock();
  });
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { window.setTimeout(layout, 120); });
}

/* =========================================================================
   15. MAIN LOOP  -  fixed timestep, so the game runs at the same speed everywhere
   ========================================================================= */
const STEP = 1 / 60;
let lastT = 0, acc = 0;
function frame(now) {
  window.requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.25) dt = 0.25;                                  // after a pause, do not try to catch up
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 20) { update(STEP); acc -= STEP; n++; }
  if (n >= 20) acc = 0;
  render();
}
function showNoGL() {                                        // a friendly note in both languages, and nothing breaks
  const box = $('nogl');
  $('noglEn1').textContent = CONFIG.strings.en.nogl1; $('noglEn2').textContent = CONFIG.strings.en.nogl2;
  $('noglFr1').textContent = CONFIG.strings.fr.nogl1; $('noglFr2').textContent = CONFIG.strings.fr.nogl2;
  qsa('.screen, #hud').forEach(function (el) { el.classList.add('hidden'); });
  box.classList.remove('hidden');
}
function boot() {
  Save.load();
  Speech.init();
  const okGL = GLR.init();
  wire();
  layout();
  applySettings();
  applyLang();
  if (!okGL) { showNoGL(); return; }
  showScreen('title');
  window.requestAnimationFrame(frame);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
